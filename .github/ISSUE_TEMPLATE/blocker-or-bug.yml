name: Blocker or bug report
description: Record a reproducible technical blocker.
title: "[Blocker] "
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output or logs
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
  - type: textarea
    id: impact
    attributes:
      label: Learning or product impact
